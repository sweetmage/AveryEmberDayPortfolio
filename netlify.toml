[build]
  command = "next build"
  publish = "out"
  # Exit 0 cancels the build (and the billed minutes). Agent/process docs never
  # reach `out/`, so a docs-only push has nothing to deploy. Listed explicitly
  # rather than globbing '*.md' because public/**/*.md IS copied into the export.
  #
  # The empty-ref guard is load-bearing: with $CACHED_COMMIT_REF unset this
  # collapses to `git diff --quiet -- <paths>`, i.e. working tree vs index on a
  # clean checkout, which always exits 0 and would silently skip EVERY build.
  # That is exactly what happened on deploy 6a669734 (commit aef8d5a). Any
  # failure to compare must fall through to exit 1 (build), never exit 0.
  #
  # The equal-ref guard is load-bearing too. When Netlify has no cached build
  # for the branch (the cache expires; the 2026-10-05 push came 8 weeks after
  # the last build) it sets CACHED_COMMIT_REF to COMMIT_REF itself, and a
  # commit diffed against itself is always empty: deploy 6ac41b0d (commit
  # 0db364a, 27 code files) was cancelled as "no content change". Equal refs
  # mean there is nothing to compare against, so build.
  ignore = '''
  if [ -z "$CACHED_COMMIT_REF" ] || [ -z "$COMMIT_REF" ]; then echo "netlify-ignore: refs missing -> building"; exit 1; fi; if [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then echo "netlify-ignore: no previous build to compare -> building"; exit 1; fi; if git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ':(exclude)docs/' ':(exclude)LOGBOOK.md' ':(exclude)TODO.md' ':(exclude)AGENTS.md' ':(exclude)CLAUDE.md' ':(exclude)CODEX.md' ':(exclude)GEMINI.md' ':(exclude)CURSOR.md' ':(exclude)KILO.md' ':(exclude)COPILOT.md' ':(exclude)BLACKBOX.md'; then echo "netlify-ignore: docs-only -> skipping"; exit 0; else echo "netlify-ignore: deployable change -> building"; exit 1; fi
  '''

[build.environment]
  NODE_VERSION = "20"
  # Netlify only ever runs `next build`, never `playwright test`. Playwright's
  # npm install hook otherwise fetches Chromium/Firefox/WebKit on every build
  # into ~/.cache/ms-playwright, which sits outside Netlify's node_modules cache
  # and so re-downloads every time. The package still installs; only the
  # binaries are skipped.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Projects and Gallery became one Portfolio page on 2026-10-05.
# ORDER MATTERS, and the bare rules carry NO splat. Netlify takes the first
# match, so the specific project paths come first; "/projects/" without a `*`
# matches only the index (Netlify normalizes the trailing slash), so it can
# never swallow a deeper old URL. Do not "simplify" these to "/projects/*".
# Old hash links (/projects/#brand, /gallery/#filter=...) keep their hash
# across the 301; app/portfolio/LegacyHashForwarder.tsx finishes the hop.
[[redirects]]
  from = "/projects/brand-avery-ember-day/*"
  to = "/portfolio/brand/"
  status = 301

[[redirects]]
  from = "/projects/history-of-mistrust/*"
  to = "/portfolio/history-of-mistrust/"
  status = 301

[[redirects]]
  from = "/projects/"
  to = "/portfolio/"
  status = 301

[[redirects]]
  from = "/gallery/"
  to = "/portfolio/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    Link = "<https://fonts.googleapis.com>; rel=preconnect, <https://fonts.gstatic.com>; rel=preconnect"
