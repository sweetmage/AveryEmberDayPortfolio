[build]
  command = "next build"
  publish = "out"
  # Exit 0 cancels the build (and the billed minutes). Agent/process docs never
  # reach `out/`, so a docs-only push has nothing to deploy. Listed explicitly
  # rather than globbing '*.md' because public/**/*.md IS copied into the export.
  #
  # The empty-ref guard is load-bearing: with $CACHED_COMMIT_REF unset this
  # collapses to `git diff --quiet -- <paths>`, i.e. working tree vs index on a
  # clean checkout, which always exits 0 and would silently skip EVERY build.
  # That is exactly what happened on deploy 6a669734 (commit aef8d5a). Any
  # failure to compare must fall through to exit 1 (build), never exit 0.
  ignore = '''
  if [ -z "$CACHED_COMMIT_REF" ] || [ -z "$COMMIT_REF" ]; then echo "netlify-ignore: refs missing -> building"; exit 1; fi; if git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ':(exclude)docs/' ':(exclude)LOGBOOK.md' ':(exclude)TODO.md' ':(exclude)AGENTS.md' ':(exclude)CLAUDE.md' ':(exclude)CODEX.md' ':(exclude)GEMINI.md' ':(exclude)CURSOR.md' ':(exclude)KILO.md' ':(exclude)COPILOT.md' ':(exclude)BLACKBOX.md'; then echo "netlify-ignore: docs-only -> skipping"; exit 0; else echo "netlify-ignore: deployable change -> building"; exit 1; fi
  '''

[build.environment]
  NODE_VERSION = "20"
  # Netlify only ever runs `next build`, never `playwright test`. Playwright's
  # npm install hook otherwise fetches Chromium/Firefox/WebKit on every build
  # into ~/.cache/ms-playwright, which sits outside Netlify's node_modules cache
  # and so re-downloads every time. The package still installs; only the
  # binaries are skipped.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[redirects]]
  from = "/projects/brand-avery-ember-day/*"
  to = "/projects/#brand"
  status = 301

[[redirects]]
  from = "/projects/history-of-mistrust/*"
  to = "/projects/#history-of-mistrust"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    Link = "<https://fonts.googleapis.com>; rel=preconnect, <https://fonts.gstatic.com>; rel=preconnect"
