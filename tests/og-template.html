<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Sriracha&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #0A0A0A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Sriracha', cursive;
    }
    .content {
      text-align: center;
    }
    h1 {
      color: #f3f3ee;
      font-size: 96px;
      margin: 0;
      letter-spacing: -0.02em;
    }
    p {
      color: #a2a29a;
      font-size: 36px;
      margin-top: 20px;
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .accent {
      color: #CC44FF;
    }
    .glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(600px 400px at 20% 30%, rgba(204, 68, 255, 0.15), transparent 60%),
        radial-gradient(500px 350px at 80% 70%, rgba(0, 255, 255, 0.10), transparent 55%);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <h1>Avery Ember Day</h1>
    <p>Brand & Visual <span class="accent">Designer</span></p>
  </div>
</body>
</html>
